<div class="lightbox" id="lightbox">
  <button class="lightbox__close" type="button" aria-label="Fermer l'image">×</button>
  <img class="lightbox__image" src="" alt="">
</div>

<script>
  const filterButtons = document.querySelectorAll(".button");
  const realisationCards = document.querySelectorAll(".realisation-card");

  filterButtons.forEach((button) => {
    button.addEventListener("click", () => {
      const selectedFilter = button.dataset.filter;

      // Retire l'état actif de tous les boutons
      filterButtons.forEach((btn) => {
        btn.classList.remove("is-active");
      });

      // Ajoute l'état actif au bouton cliqué
      button.classList.add("is-active");

      // Filtre les cartes
      realisationCards.forEach((card) => {
        const cardCategory = card.dataset.category;

        if (selectedFilter === "all" || selectedFilter === cardCategory) {
          card.style.display = "";
        } else {
          card.style.display = "none";
        }
      });
    });
  });
</script>

<script>
    const lightbox = document.querySelector("#lightbox");
const lightboxImage = document.querySelector(".lightbox__image");
const lightboxClose = document.querySelector(".lightbox__close");
const galleryImages = document.querySelectorAll(".realisation-card img");

galleryImages.forEach((image) => {
  image.addEventListener("click", () => {
    lightboxImage.src = image.src;
    lightboxImage.alt = image.alt;
    lightbox.classList.add("is-open");
    document.body.style.overflow = "hidden";
  });
});

function closeLightbox() {
  lightbox.classList.remove("is-open");
  lightboxImage.src = "";
  document.body.style.overflow = "";
}

lightboxClose.addEventListener("click", closeLightbox);

lightbox.addEventListener("click", (event) => {
  if (event.target === lightbox) {
    closeLightbox();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
    closeLightbox();
  }
});
</script>
<script>
  const menuIcon = document.querySelector(".menu-icon");
  const navbar = document.querySelector(".navlinks");

  menuIcon.addEventListener("click", () => {
    navbar.classList.toggle("active");

    const icon = menuIcon.querySelector("i");

    if (navbar.classList.contains("active")) {
      icon.classList.remove("fa-bars");
      icon.classList.add("fa-xmark");
    } else {
      icon.classList.remove("fa-xmark");
      icon.classList.add("fa-bars");
    }
  });
</script>
